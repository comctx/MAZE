<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>MAZE™ — Find Your Way Out</title>

<style>
:root{
 --bg:#07111f;
 --panel:#10213a;
 --text:#f6f8ff;
 --muted:#9fb0c8;
 --border:rgba(255,255,255,.11);
 --blue:#65d8ff;
 --purple:#7b6cff;
 --green:#6ee7a8;
 --red:#ff7f93;
}

*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:
 radial-gradient(circle at 20% 0%,rgba(88,108,255,.22),transparent 28rem),
 linear-gradient(180deg,#09182b,#07111f 60%,#050b14);
}

button,select{font:inherit}
button{cursor:pointer}

.app{
 width:min(100%,820px);
 margin:auto;
 padding:calc(16px + env(safe-area-inset-top)) 14px 35px;
}

.top{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:14px;
}

.brand{
 display:flex;
 align-items:center;
 gap:12px;
}

.logo{
 width:52px;
 height:52px;
 display:grid;
 place-items:center;
 border-radius:16px;
 font-size:25px;
 font-weight:900;
 background:linear-gradient(135deg,#62dcff,#736dff,#9459d8);
 box-shadow:0 10px 30px rgba(82,130,255,.35);
}

h1{
 margin:0;
 font-size:42px;
 line-height:1;
}

.subtitle{
 margin-top:4px;
 color:var(--muted);
 font-size:14px;
}

.badge{
 padding:7px 10px;
 border:1px solid var(--border);
 border-radius:999px;
 color:#dce8ff;
 font-size:12px;
}

.card{
 padding:12px;
 margin-bottom:12px;
 border:1px solid var(--border);
 border-radius:21px;
 background:linear-gradient(180deg,rgba(18,36,59,.96),rgba(13,27,46,.96));
 box-shadow:0 18px 45px rgba(0,0,0,.3);
}

.controls{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
}

select,.btn{
 min-height:43px;
 padding:9px 12px;
 border:1px solid var(--border);
 border-radius:13px;
 background:rgba(255,255,255,.055);
 color:white;
 font-weight:700;
}

select{
 flex:1;
 min-width:150px;
}

.btn.primary{
 border:0;
 background:linear-gradient(135deg,#61cfff,#706bff);
}

.btn.active{
 background:rgba(101,216,255,.14);
 border-color:#65d8ff;
}

.status{
 margin-top:9px;
 padding:9px;
 text-align:center;
 border:1px solid var(--border);
 border-radius:13px;
 color:#cfe0f7;
 background:rgba(255,255,255,.035);
 font-size:13px;
 font-weight:700;
}

.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 text-align:center;
}

.label{
 color:var(--muted);
 font-size:11px;
 text-transform:uppercase;
 letter-spacing:.08em;
}

.value{
 margin-top:2px;
 font-size:20px;
 font-weight:850;
}

.maze-card{
 padding:10px;
}

.wrap{
 width:100%;
 aspect-ratio:1/1;
 overflow:hidden;
 border-radius:17px;
 background:#07101c;
 cursor:crosshair;
 touch-action:none;
}

canvas{
 width:100%;
 height:100%;
 display:block;
}

.hint{
 margin:10px 3px 2px;
 text-align:center;
 color:var(--muted);
 font-size:13px;
 line-height:1.4;
}

footer{
 margin-top:24px;
 text-align:center;
 color:#71829b;
 font-size:12px;
}

.modal{
 position:fixed;
 inset:0;
 display:none;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:rgba(3,8,15,.8);
 backdrop-filter:blur(6px);
}

.modal.show{display:flex}

.modal-box{
 width:min(100%,420px);
 padding:24px;
 border:1px solid var(--border);
 border-radius:24px;
 text-align:center;
 background:#10213a;
}

.modal-box h2{
 margin:8px 0;
 font-size:30px;
}

.trophy{font-size:52px}

.modal-buttons{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 margin-top:16px;
}

@media(max-width:560px){
 .badge{display:none}

 .controls{
  display:grid;
  grid-template-columns:1fr 1fr;
 }

 select{
  grid-column:1/-1;
 }

 .btn{
  padding:8px 6px;
  font-size:13px;
 }

 h1{font-size:36px}
}
</style>
</head>

<body>

<div class="app">

<header class="top">
 <div class="brand">
  <div class="logo">M</div>
  <div>
   <h1>MAZE™</h1>
   <div class="subtitle">Find Your Way Out</div>
  </div>
 </div>
 <div class="badge">Unlimited Mazes</div>
</header>

<section class="card">

 <div class="controls">

  <select id="difficulty">
   <option value="11">Easy</option>
   <option value="17" selected>Medium</option>
   <option value="25">Hard</option>
   <option value="35">Extreme</option>
  </select>

  <select id="mazeType">
   <option value="classic">Classic Maze</option>
   <option value="keys">🔑 Keys & Doors</option>
   <option value="memory">🧠 Memory Maze</option>
   <option value="portal">🌀 Portal Maze</option>
  </select>

  <button id="newMaze" class="btn primary">
   New Maze
  </button>

  <button id="restart" class="btn">
   Restart
  </button>

  <button id="flashlight" class="btn">
   🔦 Flashlight
  </button>

  <button id="daily" class="btn">
   📅 Daily Maze
  </button>

 </div>

 <div id="status" class="status">
  Classic Maze — reach the glowing exit.
 </div>

</section>

<section class="card stats">

 <div>
  <div class="label">Time</div>
  <div id="time" class="value">0:00</div>
 </div>

 <div>
  <div class="label">Steps</div>
  <div id="steps" class="value">0</div>
 </div>

 <div>
  <div class="label">Best</div>
  <div id="best" class="value">—</div>
 </div>

</section>

<section class="card maze-card">

 <div id="wrap" class="wrap">
  <canvas id="maze"></canvas>
 </div>

 <div class="hint">
  Drag your finger or mouse through the maze.
  On a computer you can also use the arrow keys or WASD.
 </div>

</section>

<footer>
 A DONCO-BAYCITY™ App
</footer>

</div>

<div id="winModal" class="modal">

 <div class="modal-box">

  <div class="trophy">🏁</div>

  <h2>You escaped!</h2>

  <div id="winText"></div>

  <div class="modal-buttons">

   <button id="playAgain" class="btn">
    Restart
   </button>

   <button id="nextMaze" class="btn primary">
    New Maze
   </button>

  </div>

 </div>

</div>

<script>
const canvas=document.getElementById("maze");
const ctx=canvas.getContext("2d");
const wrap=document.getElementById("wrap");

const difficulty=document.getElementById("difficulty");
const mazeTypeSelect=document.getElementById("mazeType");

const timeEl=document.getElementById("time");
const stepsEl=document.getElementById("steps");
const bestEl=document.getElementById("best");

const statusEl=document.getElementById("status");
const flashlightBtn=document.getElementById("flashlight");

const modal=document.getElementById("winModal");
const winText=document.getElementById("winText");

let size=17;
let grid=[];
let player={x:0,y:0};

let steps=0;
let startTime=null;
let timer=null;
let won=false;

let flashlight=false;
let mazeType="classic";
let dailyMode=false;

let keyPos=null;
let hasKey=false;

let portals=[];

let memoryVisible=true;
let memoryTimer=null;

let rng=Math.random;


/* RANDOM GENERATOR FOR DAILY MAZE */

function seededRandom(seed){
 return function(){
  let t=seed+=0x6D2B79F5;
  t=Math.imul(t^t>>>15,t|1);
  t^=t+Math.imul(t^t>>>7,t|61);
  return((t^t>>>14)>>>0)/4294967296;
 };
}

function hash(text){
 let h=2166136261;

 for(let i=0;i<text.length;i++){
  h^=text.charCodeAt(i);
  h=Math.imul(h,16777619);
 }

 return h>>>0;
}


/* MAZE GENERATION */

function cell(x,y){
 return{
  x,
  y,
  visited:false,
  walls:{
   top:true,
   right:true,
   bottom:true,
   left:true
  }
 };
}

function generateMaze(){

 grid=Array.from(
  {length:size},
  (_,y)=>
  Array.from(
   {length:size},
   (_,x)=>cell(x,y)
  )
 );

 let current=grid[0][0];
 const stack=[];

 current.visited=true;

 while(true){

  const choices=[];
  const x=current.x;
  const y=current.y;

  if(y>0 && !grid[y-1][x].visited)
   choices.push({
    cell:grid[y-1][x],
    dir:"top"
   });

  if(x<size-1 && !grid[y][x+1].visited)
   choices.push({
    cell:grid[y][x+1],
    dir:"right"
   });

  if(y<size-1 && !grid[y+1][x].visited)
   choices.push({
    cell:grid[y+1][x],
    dir:"bottom"
   });

  if(x>0 && !grid[y][x-1].visited)
   choices.push({
    cell:grid[y][x-1],
    dir:"left"
   });

  if(choices.length){

   const pick=
   choices[
    Math.floor(
     rng()*choices.length
    )
   ];

   const next=pick.cell;

   if(pick.dir==="top"){
    current.walls.top=false;
    next.walls.bottom=false;
   }

   if(pick.dir==="right"){
    current.walls.right=false;
    next.walls.left=false;
   }

   if(pick.dir==="bottom"){
    current.walls.bottom=false;
    next.walls.top=false;
   }

   if(pick.dir==="left"){
    current.walls.left=false;
    next.walls.right=false;
   }

   stack.push(current);

   current=next;
   current.visited=true;

  }else if(stack.length){

   current=stack.pop();

  }else{

   break;

  }
 }
}


/* GAME MODES */

function same(a,b){
 return(
  a &&
  b &&
  a.x===b.x &&
  a.y===b.y
 );
}

function randomCell(exclude=[]){

 let p;

 do{

  p={
   x:Math.floor(rng()*size),
   y:Math.floor(rng()*size)
  };

 }while(
  same(p,{x:0,y:0}) ||
  same(p,{x:size-1,y:size-1}) ||
  exclude.some(e=>same(e,p))
 );

 return p;
}

function setupMode(){

 mazeType=mazeTypeSelect.value;

 keyPos=null;
 hasKey=false;

 portals=[];

 memoryVisible=true;

 if(mazeType==="keys"){
  keyPos=randomCell();
 }

 if(mazeType==="portal"){

  const first=randomCell();
  const second=randomCell([first]);

  portals=[
   first,
   second
  ];
 }

 updateStatus();
}

function updateStatus(message){

 if(message){
  statusEl.textContent=message;
  return;
 }

 if(mazeType==="keys"){

  statusEl.textContent=
  hasKey
  ? "🔑 Key found — the exit is unlocked!"
  : "🔑 Find the gold key, then reach the exit.";

 }else if(mazeType==="memory"){

  statusEl.textContent=
  memoryVisible
  ? "🧠 Memorize the maze — the walls disappear in 4 seconds."
  : "🧠 Walls hidden — use your memory.";

 }else if(mazeType==="portal"){

  statusEl.textContent=
  "🌀 Purple and gold portals teleport you across the maze.";

 }else{

  statusEl.textContent=
  "Classic Maze — reach the glowing exit.";

 }
}

function startMemoryMode(){

 clearTimeout(memoryTimer);

 if(mazeType!=="memory")
  return;

 memoryVisible=true;

 updateStatus();
 draw();

 memoryTimer=setTimeout(
  ()=>{
   memoryVisible=false;
   updateStatus();
   draw();
  },
  4000
 );
}


/* CANVAS */

function resize(){

 const rect=
 wrap.getBoundingClientRect();

 const dpr=
 window.devicePixelRatio || 1;

 canvas.width=
 Math.floor(rect.width*dpr);

 canvas.height=
 Math.floor(rect.width*dpr);

 canvas.style.width=
 rect.width+"px";

 canvas.style.height=
 rect.width+"px";

 ctx.setTransform(
  dpr,0,0,dpr,0,0
 );

 draw();
}

function draw(){

 if(!grid.length)
  return;

 const width=
 wrap.clientWidth;

 const c=
 width/size;

 ctx.clearRect(
  0,0,width,width
 );

 ctx.fillStyle="#07101c";

 ctx.fillRect(
  0,0,width,width
 );

 const exitX=
 (size-1)*c+c/2;

 const exitY=
 (size-1)*c+c/2;

 const locked=
 mazeType==="keys" &&
 !hasKey;


 /* EXIT GLOW */

 const glow=
 ctx.createRadialGradient(
  exitX,
  exitY,
  0,
  exitX,
  exitY,
  c
 );

 glow.addColorStop(
  0,
  locked
  ? "rgba(255,127,147,.85)"
  : "rgba(110,231,168,.85)"
 );

 glow.addColorStop(
  1,
  "rgba(0,0,0,0)"
 );

 ctx.fillStyle=glow;

 ctx.fillRect(
  exitX-c,
  exitY-c,
  c*2,
  c*2
 );


 /* WALLS */

 const showWalls=
 mazeType!=="memory" ||
 memoryVisible;

 if(showWalls){

  ctx.strokeStyle="#d9e7ff";

  ctx.lineWidth=
  Math.max(
   1.2,
   Math.min(
    3,
    24/size
   )
  );

  for(let y=0;y<size;y++){

   for(let x=0;x<size;x++){

    const current=
    grid[y][x];

    const px=x*c;
    const py=y*c;

    ctx.beginPath();

    if(current.walls.top){
     ctx.moveTo(px,py);
     ctx.lineTo(px+c,py);
    }

    if(current.walls.right){
     ctx.moveTo(px+c,py);
     ctx.lineTo(px+c,py+c);
    }

    if(current.walls.bottom){
     ctx.moveTo(px,py+c);
     ctx.lineTo(px+c,py+c);
    }

    if(current.walls.left){
     ctx.moveTo(px,py);
     ctx.lineTo(px,py+c);
    }

    ctx.stroke();
   }
  }

 }else{

  ctx.strokeStyle=
  "rgba(217,231,255,.18)";

  ctx.lineWidth=2;

  ctx.strokeRect(
   1,
   1,
   width-2,
   width-2
  );

 }


 /* START */

 ctx.fillStyle="#65d8ff";

 ctx.beginPath();

 ctx.arc(
  c/2,
  c/2,
  Math.max(3,c*.18),
  0,
  Math.PI*2
 );

 ctx.fill();


 /* EXIT */

 ctx.fillStyle=
 locked
 ? "#ff7f93"
 : "#6ee7a8";

 ctx.beginPath();

 ctx.arc(
  exitX,
  exitY,
  Math.max(3,c*.24),
  0,
  Math.PI*2
 );

 ctx.fill();


 /* KEY */

 if(
  mazeType==="keys" &&
  keyPos
 ){

  const x=
  keyPos.x*c+c/2;

  const y=
  keyPos.y*c+c/2;

  ctx.strokeStyle="#ffd76a";

  ctx.lineWidth=
  Math.max(2,c*.10);

  ctx.beginPath();

  ctx.arc(
   x-c*.10,
   y,
   Math.max(3,c*.16),
   0,
   Math.PI*2
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(
   x+c*.05,
   y
  );

  ctx.lineTo(
   x+c*.30,
   y
  );

  ctx.lineTo(
   x+c*.30,
   y+c*.12
  );

  ctx.stroke();
 }


 /* PORTALS */

 if(
  mazeType==="portal" &&
  portals.length===2
 ){

  const colors=[
   "#9a6cff",
   "#ffd166"
  ];

  portals.forEach(
   (p,i)=>{

    const x=
    p.x*c+c/2;

    const y=
    p.y*c+c/2;

    ctx.strokeStyle=
    colors[i];

    ctx.lineWidth=
    Math.max(3,c*.13);

    ctx.shadowColor=
    colors[i];

    ctx.shadowBlur=10;

    ctx.beginPath();

    ctx.arc(
     x,
     y,
     Math.max(5,c*.28),
     0,
     Math.PI*2
    );

    ctx.stroke();

    ctx.shadowBlur=0;
   }
  );
 }


 /* PLAYER TOUCH MARKER */

 const px=
 player.x*c+c/2;

 const py=
 player.y*c+c/2;

 ctx.strokeStyle="white";

 ctx.lineWidth=
 Math.max(2,c*.10);

 ctx.shadowColor="#65d8ff";
 ctx.shadowBlur=12;

 ctx.beginPath();

 ctx.arc(
  px,
  py,
  Math.max(6,c*.34),
  0,
  Math.PI*2
 );

 ctx.stroke();

 ctx.fillStyle="#65d8ff";

 ctx.beginPath();

 ctx.arc(
  px,
  py,
  Math.max(3,c*.12),
  0,
  Math.PI*2
 );

 ctx.fill();

 ctx.shadowBlur=0;


 /* FLASHLIGHT MODE */

 if(flashlight){

  ctx.save();

  ctx.fillStyle=
  "rgba(0,0,0,.93)";

  ctx.fillRect(
   0,0,width,width
  );

  ctx.globalCompositeOperation=
  "destination-out";

  const radius=
  Math.max(
   c*2.5,
   Math.min(
    width*.19,
    95
   )
  );

  const light=
  ctx.createRadialGradient(
   px,
   py,
   radius*.2,
   px,
   py,
   radius
  );

  light.addColorStop(
   0,
   "rgba(0,0,0,1)"
  );

  light.addColorStop(
   .65,
   "rgba(0,0,0,.85)"
  );

  light.addColorStop(
   1,
   "rgba(0,0,0,0)"
  );

  ctx.fillStyle=light;

  ctx.beginPath();

  ctx.arc(
   px,
   py,
   radius,
   0,
   Math.PI*2
  );

  ctx.fill();

  ctx.restore();


  ctx.strokeStyle="white";
  ctx.lineWidth=2;
  ctx.shadowColor="#65d8ff";
  ctx.shadowBlur=12;

  ctx.beginPath();

  ctx.arc(
   px,
   py,
   Math.max(6,c*.34),
   0,
   Math.PI*2
  );

  ctx.stroke();

  ctx.shadowBlur=0;
 }
}


/* TIMER */

function formatTime(seconds){

 const minutes=
 Math.floor(seconds/60);

 const secs=
 seconds%60;

 return(
  minutes+
  ":"+
  String(secs)
  .padStart(2,"0")
 );
}

function startClock(){

 if(startTime!==null)
  return;

 startTime=Date.now();

 timer=setInterval(
  ()=>{

   const seconds=
   Math.floor(
    (Date.now()-startTime)/1000
   );

   timeEl.textContent=
   formatTime(seconds);

  },
  250
 );
}

function elapsed(){

 if(startTime===null)
  return 0;

 return Math.floor(
  (Date.now()-startTime)/1000
 );
}

function bestKey(){

 return(
  "maze_best_"+
  size+"_"+
  mazeType+"_"+
  (
   flashlight
   ? "flash"
   : "normal"
  )
 );
}

function updateBest(){

 const value=
 localStorage.getItem(
  bestKey()
 );

 bestEl.textContent=
 value
 ? formatTime(Number(value))
 : "—";
}


/* MOVEMENT */

function move(direction){

 if(won)
  return;

 const current=
 grid[player.y][player.x];

 let x=player.x;
 let y=player.y;

 if(
  direction==="up" &&
  !current.walls.top
 )
 y--;

 if(
  direction==="right" &&
  !current.walls.right
 )
 x++;

 if(
  direction==="down" &&
  !current.walls.bottom
 )
 y++;

 if(
  direction==="left" &&
  !current.walls.left
 )
 x--;

 if(
  x===player.x &&
  y===player.y
 )
 return;

 startClock();

 player={x,y};

 steps++;

 stepsEl.textContent=
 steps;


 /* PICK UP KEY */

 if(
  mazeType==="keys" &&
  keyPos &&
  same(player,keyPos)
 ){

  hasKey=true;
  keyPos=null;

  updateStatus();
 }


 /* PORTAL */

 if(
  mazeType==="portal" &&
  portals.length===2
 ){

  if(same(player,portals[0])){

   player={
    ...portals[1]
   };

   updateStatus(
    "🌀 Portal jump!"
   );

  }else if(
   same(player,portals[1])
  ){

   player={
    ...portals[0]
   };

   updateStatus(
    "🌀 Portal jump!"
   );

  }
 }

 draw();


 /* EXIT */

 if(
  player.x===size-1 &&
  player.y===size-1
 ){

  if(
   mazeType==="keys" &&
   !hasKey
  ){

   updateStatus(
    "🔒 Exit locked — find the gold key first."
   );

  }else{

   finish();

  }
 }
}


/* WIN */

function finish(){

 won=true;

 clearInterval(timer);

 const seconds=
 elapsed();

 const key=
 bestKey();

 const previous=
 Number(
  localStorage.getItem(key)
 );

 if(
  !previous ||
  seconds<previous
 ){

  localStorage.setItem(
   key,
   seconds
  );
 }

 updateBest();

 const mazeName=
 mazeTypeSelect
 .options[
  mazeTypeSelect.selectedIndex
 ]
 .text;

 winText.textContent=
 "You finished the "+
 difficulty.options[
  difficulty.selectedIndex
 ].text+
 " "+
 mazeName+
 " in "+
 formatTime(seconds)+
 " using "+
 steps+
 " steps.";

 modal.classList.add(
  "show"
 );
}


/* RESET */

function resetRun(){

 clearInterval(timer);
 clearTimeout(memoryTimer);

 timer=null;
 memoryTimer=null;
 startTime=null;

 steps=0;
 won=false;

 player={
  x:0,
  y:0
 };

 timeEl.textContent="0:00";
 stepsEl.textContent="0";

 modal.classList.remove(
  "show"
 );

 if(mazeType==="memory")
  memoryVisible=true;

 draw();

 startMemoryMode();
}


/* NEW MAZE */

function newMaze(daily=false){

 size=
 Number(
  difficulty.value
 );

 mazeType=
 mazeTypeSelect.value;

 dailyMode=daily;

 if(daily){

  const date=
  new Date();

  const code=
  date.getFullYear()+
  "-"+
  (date.getMonth()+1)+
  "-"+
  date.getDate()+
  "-"+
  size+
  "-"+
  mazeType;

  rng=
  seededRandom(
   hash(code)
  );

 }else{

  rng=Math.random;

 }

 generateMaze();

 setupMode();

 resetRun();

 updateBest();
}

/* KEYBOARD */

document.addEventListener(
 "keydown",
 e=>{

  const map={
   ArrowUp:"up",
   ArrowRight:"right",
   ArrowDown:"down",
   ArrowLeft:"left",
   w:"up",
   a:"left",
   s:"down",
   d:"right",
   W:"up",
   A:"left",
   S:"down",
   D:"right"
  };

  if(map[e.key]){

   e.preventDefault();

   move(
    map[e.key]
   );
  }
 }
);


/* TOUCH / MOUSE DRAG */

function directionFromPointer(
 clientX,
 clientY
){

 const rect=
 canvas.getBoundingClientRect();

 const c=
 rect.width/size;

 const tx=
 Math.floor(
  (clientX-rect.left)/c
 );

 const ty=
 Math.floor(
  (clientY-rect.top)/c
 );

 const dx=
 tx-player.x;

 const dy=
 ty-player.y;

 if(
  Math.abs(dx)>
  Math.abs(dy)
 ){

  if(dx>0)
   return "right";

  if(dx<0)
   return "left";

 }else{

  if(dy>0)
   return "down";

  if(dy<0)
   return "up";

 }

 return null;
}

let dragging=false;
let lastMove=0;

wrap.addEventListener(
 "pointerdown",
 e=>{

  dragging=true;

  wrap.setPointerCapture?.(
   e.pointerId
  );

  const direction=
  directionFromPointer(
   e.clientX,
   e.clientY
  );

  if(direction)
   move(direction);
 }
);

wrap.addEventListener(
 "pointermove",
 e=>{

  if(!dragging)
   return;

  const now=
  Date.now();

  if(
   now-lastMove<65
  )
   return;

  lastMove=now;

  const direction=
  directionFromPointer(
   e.clientX,
   e.clientY
  );

  if(direction)
   move(direction);
 }
);

wrap.addEventListener(
 "pointerup",
 e=>{

  dragging=false;

  wrap.releasePointerCapture?.(
   e.pointerId
  );
 }
);

wrap.addEventListener(
 "pointercancel",
 ()=>{
  dragging=false;
 }
);


/* WIN SCREEN */

document
.getElementById("playAgain")

resetRun;

.getElementById("nextMaze")

()=>newMaze(false);

 resize
);

newMaze(false);

requestAnimationFrame(
 resize
);
